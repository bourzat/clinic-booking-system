# Render Blueprint: one Docker web service and one managed Postgres.
# autoDeploy is off on purpose. GitHub Actions triggers the deploy only after tests pass on main.
databases:
  - name: clinic-db
    plan: free
    databaseName: clinic
    user: clinic

services:
  - type: web
    name: clinic-booking-api
    runtime: docker
    plan: free
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-db
          property: connectionString
      - key: CLINIC_TIMEZONE
        value: Africa/Nairobi
